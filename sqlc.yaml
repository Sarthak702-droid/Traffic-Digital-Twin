version: '2'
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: queries
        out: apps/api/internal/store/queries
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage
